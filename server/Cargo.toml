[package]
name = "resume-sync"
version = "0.1.0"
edition = "2021"

# SpacetimeDB modules compile to a WebAssembly library.
[lib]
crate-type = ["cdylib"]

[dependencies]
# Keep in lockstep with the installed `spacetime` CLI (`spacetime --version`).
# `unstable` is required for the row-level-security API (client_visibility_filter).
spacetimedb = { version = "2.7.1", features = ["unstable"] }
